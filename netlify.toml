[build]
  command = "npm run build"
  publish = "dist/static"

# SPA 路由配置：将所有路径重定向到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Dify 代理配置：解决 HTTPS 混合内容问题
# 将 /dify-api/* 转发到您的 HTTP 服务器
[[redirects]]
  from = "/dify-api/*"
  to = "http://47.102.47.217:8088/:splat"
  status = 200
  force = true
